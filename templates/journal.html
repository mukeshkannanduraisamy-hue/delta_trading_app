{% extends "base.html" %}
{% block title %}Trade Journal — Delta Trading{% endblock %}
{% block nav_journal %}active{% endblock %}

{% block content %}
<style>
  .jwrap { display:flex; flex-direction:column; gap:var(--gap); padding:20px; max-width:1400px; margin:0 auto; }
  .panel { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); }
  .panel h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px;
    text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); display:flex; align-items:center; gap:10px; }
  .filters { display:flex; gap:14px; align-items:center; flex-wrap:wrap;
    background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; }
  .filters label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; display:flex; flex-direction:column; gap:4px; }
  .filters select { background:var(--card-bg-2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; }
  .count { margin-left:auto; font-size:13px; color:var(--text-dim); }
  table.t { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.t th { text-align:left; color:var(--text-dim); font-weight:600; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.4px; padding:8px 10px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card-bg); }
  table.t td { padding:8px 10px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  table.t tr:hover td { background:var(--card-bg-2); }
  .tag { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; }
  .tag.ce { background:var(--success-soft); color:var(--success); }
  .tag.pe { background:var(--danger-soft); color:var(--danger); }
  .tag.paper { background:var(--primary-soft); color:var(--primary); }
  .tag.live_demo { background:var(--danger-soft); color:var(--danger); }
  .pos { color:var(--success); } .neg { color:var(--danger); }
  .why { color:var(--text-dim); font-size:11px; }
  .empty { color:var(--text-dim); padding:24px; text-align:center; }
  .tbl-scroll { max-height:70vh; overflow:auto; }
</style>

<div class="jwrap">
  <div class="filters">
    <label>Strategy<select id="f-strategy"><option value="all">All</option></select></label>
    <label>Outcome<select id="f-outcome"><option value="all">All</option><option value="win">Wins</option><option value="loss">Losses</option></select></label>
    <label>Mode<select id="f-mode"><option value="all">All</option><option value="paper">Paper</option><option value="live_demo">Live demo</option></select></label>
    <label>Show<select id="f-limit"><option>100</option><option>250</option><option>500</option><option>1000</option></select></label>
    <span class="count" id="count">—</span>
  </div>

  <div class="panel">
    <h3>Closed Trades</h3>
    <div class="tbl-scroll">
      <table class="t"><thead><tr>
        <th>Closed</th><th>Strategy</th><th>Side</th><th>Symbol</th><th>Strike</th>
        <th>Entry</th><th>Exit</th><th>Qty</th><th>Gross</th><th>Net</th><th>Exit reason</th><th>Mode</th>
      </tr></thead><tbody id="rows"><tr><td colspan="12" class="empty">Loading…</td></tr></tbody></table>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="/static/js/journal.js"></script>{% endblock %}
